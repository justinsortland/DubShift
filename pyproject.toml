[project]
name = "dubshift"
version = "0.1.0"
description = "Replace the spoken voice in educational videos while preserving timing and visual content."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "yt-dlp>=2024.8.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
dubshift = "dubshift.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dubshift"]

[tool.pytest.ini_options]
testpaths = ["tests"]
